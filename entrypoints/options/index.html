<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Media Saver — Settings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Media Saver</h1>

      <section>
        <h2>Where to save</h2>
        <label for="template">Path template inside the Downloads folder</label>
        <input id="template" type="text" spellcheck="false" autocomplete="off" />
        <p class="hint">
          Placeholders: <code>{site}</code> <code>{author}</code> <code>{postId}</code>
          <code>{mediaId}</code> <code>{index}</code> <code>{date}</code>. <code>/</code> starts a
          folder. The file extension is added automatically.
        </p>
        <p class="preview">
          Example: <span id="preview-carousel"></span><br />
          and for a single-item post: <span id="preview-single"></span>
        </p>
        <button id="reset-template" type="button" class="link">Reset to default</button>

        <label class="check">
          <input id="save-as" type="checkbox" />
          Ask where to save (only when downloading a single file)
        </label>
      </section>

      <section>
        <h2>Video quality</h2>
        <label class="check">
          <input type="radio" name="video-quality" value="best" />
          <span>
            <strong>Best</strong> — up to 1080p and higher. Instagram serves it in VP9 and TikTok in
            H.265: Chrome, VLC and modern players open them, older players may not.
          </span>
        </label>
        <label class="check">
          <input type="radio" name="video-quality" value="compatible" />
          <span>
            <strong>Compatible</strong> — a regular H.264 mp4, up to 720p on Instagram. Plays
            anywhere and downloads faster.
          </span>
        </label>
      </section>

      <p id="status" class="status" role="status"></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
